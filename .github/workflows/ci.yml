name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated lists and README links
        run: python3 scripts/build.py --check
      - name: Validate Unbound syntax
        if: matrix.python == '3.14'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unbound bind9-utils dnsmasq-base
          for file in lists/unbound/*.txt; do unbound-checkconf "$file"; done
          for file in lists/rpz/*.txt; do named-checkzone rpz.invalid "$file"; done
          for file in lists/dnsmasq/*.txt; do dnsmasq --test --conf-file="$file"; done
