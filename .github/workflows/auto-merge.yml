name: Auto-merge validated PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Do not check out or execute PR code in this privileged workflow.
      - name: Merge PRs whose current commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr list --base main --head "$HEAD_BRANCH" --state open --json number,headRefOid,isDraft,isCrossRepository \
            --jq '.[] | select(.isDraft == false and .isCrossRepository == false) | [.number, .headRefOid] | @tsv' > "$RUNNER_TEMP/prs.tsv"
          while IFS=$'\t' read -r number sha; do
            if [ "$sha" = "$HEAD_SHA" ]; then
              gh pr merge "$number" --auto --squash --match-head-commit "$HEAD_SHA"
            fi
          done < "$RUNNER_TEMP/prs.tsv"
