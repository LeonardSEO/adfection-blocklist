name: Build and discovery

on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'candidates/approved.txt'
      - 'allowlist.txt'
      - 'scripts/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify lists
        run: |
          python3 scripts/build.py
          python3 scripts/build.py --check
      - name: Commit generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lists README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated lists $(date -u +%F)"
            git push origin HEAD:main
          fi

  discovery:
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Query public research services
        id: discover
        continue-on-error: true
        env:
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: python3 scripts/discover.py --max-seconds 600
      - name: Archive discovery reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: discovery-${{ github.run_id }}
          path: |
            candidates/candidates-*.txt
            candidates/candidates-*.json
          if-no-files-found: warn
      - name: Commit current discovery reports
        if: always()
        run: |
          stem="candidates/candidates-$(date -u +%Y%m%d)"
          if [ -f "$stem.txt" ] && [ -f "$stem.json" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$stem.txt" "$stem.json"
            if ! git diff --cached --quiet; then
              git commit -m "Record discovery results $(date -u +%F)"
              git push origin HEAD:main
            fi
          fi
      - name: Open review issue for candidates or partial results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stem="candidates/candidates-$(date -u +%Y%m%d)"
          [ -f "$stem.json" ] || exit 0
          actionable=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(int(r["candidate_count"] > 0 or r["status"] == "partial"))' "$stem.json")
          [ "$actionable" -eq 1 ] || exit 0
          title="Discovery review ($(date -u +%F))"
          existing=$(gh issue list --state all --search "$title in:title" --json title --jq '.[].title')
          if printf '%s\n' "$existing" | grep -Fxq "$title"; then exit 0; fi
          {
            echo 'Review these leads before adding any to candidates/approved.txt. Shared IPs and certificates alone are insufficient.'
            echo
            echo 'The status report records skipped services and failures; partial results do not prove absence of further infrastructure.'
            echo
            echo '```text'
            cat "$stem.txt"
            echo '```'
            echo
            echo '```json'
            cat "$stem.json"
            echo '```'
          } > "$RUNNER_TEMP/discovery-issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/discovery-issue.md"
      - name: Fail visibly on incomplete discovery
        if: steps.discover.outcome != 'success'
        run: exit 1
